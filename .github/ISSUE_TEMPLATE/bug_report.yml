name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check the
        [Troubleshooting](https://github.com/ZaBug/ev-solar-manager#troubleshooting)
        section of the README and the existing issues first.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: For example the solar / charger situation when it happened.
      placeholder: |
        1. Charger is charging at 10 A with 3 kW export
        2. A cloud passes
        3. ...
  - type: input
    id: version
    attributes:
      label: EV Solar Manager version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: input
    id: charger
    attributes:
      label: Charger and its integration
      placeholder: "Duosida SmartChargePro 3 via Duosida LAN"
    validations:
      required: true
  - type: input
    id: meter
    attributes:
      label: Grid power / voltage sensor source
      placeholder: "Shelly Pro 3EM, inverter Modbus, P1 meter, ..."
  - type: dropdown
    id: phases
    attributes:
      label: Phases
      options:
        - "1"
        - "3"
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: >-
        The values from Settings → Devices & Services → EV Solar Manager →
        Configure (entities and tuning values) that are relevant to the problem.
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: >-
        Enable debug logging (see the README) and paste the lines from
        `custom_components.ev_solar_manager` around the problem.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots of history graphs (grid power, charger current) help a lot.
