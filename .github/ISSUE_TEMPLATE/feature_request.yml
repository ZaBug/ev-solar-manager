name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would you like to do that is not possible or hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: charger
    attributes:
      label: Charger and its integration
      description: Only if the request is specific to a charger.
